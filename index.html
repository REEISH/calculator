<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel=" stylesheet" href="styles.css">
    <title>Calculator</title>
</head>

<body>
    <div class="flex-1">
        <div class="flex-1-1">
            <div class="flex-1-1-1" id = "screen">
            </div>
            <div class="flex-1-1-2">
                <div class="flex-1-1-2-1" id="add">+</div>
                <div class="flex-1-1-2-2" id="sub">-</div>
                <div class="flex-1-1-2-3" id="mul">*</div>
                <div class="flex-1-1-2-4" id="div">/</div>
                <div class="flex-1-1-2-5" id="clear">C</div>
            </div>
            <div class="flex-1-1-3">
                <div class="flex-1-1-3-1" id="zero">0</div>
                <div class="flex-1-1-3-2" id="one">1</div>
                <div class="flex-1-1-3-3" id="two">2</div>
                <div class="flex-1-1-3-4" id="three">3</div>
                <div class="flex-1-1-3-5" id="four">4</div>
            </div>
            <div class="flex-1-1-4">
                <div class="flex-1-1-4-1" id="five">5</div>
                <div class="flex-1-1-4-2" id="six">6</div>
                <div class="flex-1-1-4-3" id="seven">7</div>
                <div class="flex-1-1-4-4" id="eight">8</div>
                <div class="flex-1-1-4-5" id="nine">9</div>
            </div>
            <div class="flex-1-1-5">
                <div class="flex-1-1-5-1" id="equal">=</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
